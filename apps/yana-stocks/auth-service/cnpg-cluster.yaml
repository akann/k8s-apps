apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: auth-service-pg
  namespace: yana-stocks
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
  bootstrap:
    initdb:
      postInitSQL:
        - CREATE SCHEMA IF NOT EXISTS auth
        - ALTER ROLE app SET search_path = auth
  # Continuous WAL archiving + base backups via the Barman Cloud Plugin.
  # Replaced spec.backup.barmanObjectStore on 2026-08-18 (removed in CNPG
  # 1.31.0). isWALArchiver designates this plugin as the WAL archiver; the
  # destination itself lives in the ObjectStore named below.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: auth-service-pg-store
  storage:
    size: 10Gi
    storageClass: ceph-rbd
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
