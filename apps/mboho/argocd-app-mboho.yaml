apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mboho-deployment
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: default
  source:
    repoURL: https://github.com/akann/mboho.git
    targetRevision: HEAD
    path: k8s/mboho
  destination:
    server: https://kubernetes.default.svc
    namespace: mboho
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
