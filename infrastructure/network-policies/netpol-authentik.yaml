---
# authentik: SSO provider — needs wide ingress (all apps redirect here) + egress to CNPG
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: authentik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: authentik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 9000
        - port: 9443
---
# Outpost pods serve forward auth — ingress from all namespaces (via ExternalName svc)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-outpost-ingress
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: goauthentik.io
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9000
        - port: 9443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: authentik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9300
        - port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: authentik
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-clusters
      ports:
        - port: 5432
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443  # LDAP/email/external integrations
        - port: 6443
    - ports:
        - port: 2525  # SMTP2GO STARTTLS
        - port: 465   # SMTP2GO SSL
---
# Proxy outposts redeem OAuth codes over the in-cluster authentik-server Service
# rather than the public ingress hostname. authentik 2026.8 rewrote the proxy
# outpost from Go to Rust, and its back-channel POST to /application/o/token/ is
# rejected by ingress-nginx with a 400 before it is ever proxied upstream
# (empty proxy_upstream_name, request_time 0.000) — breaking the auth callback and
# putting every gated app into a login loop. Keeping the back-channel inside the
# cluster bypasses nginx entirely. The outposts' own GET API polling still goes out
# over 443 via allow-egress; only the token exchange moves in-cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-outpost-to-server-egress
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: goauthentik.io
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/instance: authentik
              app.kubernetes.io/component: server
      ports:
        - port: 9000
---
# Counterpart ingress rule: allow-ingress-nginx only admits the ingress-nginx
# namespace, so without this the outposts would be blocked at the server side.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-ingress-from-outposts
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/instance: authentik
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: goauthentik.io
      ports:
        - port: 9000
