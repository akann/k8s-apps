---
# cnpg-system: CloudNativePG operator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
        - port: 9443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-clusters
      ports:
        - port: 8000
        - port: 5432
        - port: 9187
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
      ports:
        - port: 8000
        - port: 5432
        - port: 9187
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: yana-stocks
      ports:
        - port: 8000
        - port: 5432
        - port: 9187
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k8s-docs
      ports:
        - port: 8000
        - port: 5432
        - port: 9187
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ops-agent
      ports:
        - port: 8000
        - port: 5432
        - port: 9187
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: akan
      ports:
        - port: 8000
        - port: 5432
        - port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-apiserver-egress
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
        - port: 6443
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# CNPG-I plugin traffic: the operator talks gRPC to the Barman Cloud Plugin
# Deployment on 9090, both inside cnpg-system.
#
# Needed because this namespace has default-deny-all and NOTHING else opens
# 9090: allow-cnpg-operator's ingress covers only 8080/9443, and its egress
# only reaches the app namespaces on 8000/5432/9187. The operator logging
# "Registered plugin" is NOT evidence this path works — registration only
# reads the Service and TLS Secret from the API server. The gRPC call happens
# later, when reconciling a Cluster that references the plugin, so without
# this rule every plugin-backed cluster would fail to archive WAL while the
# plugin still looked healthy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-plugin-grpc
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 9090
  egress:
    - to:
        - podSelector: {}
      ports:
        - port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: cnpg-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
---
# cnpg-clusters: pg-main cluster (3 instances)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cnpg-clusters
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator
  namespace: cnpg-clusters
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-apiserver-egress
  namespace: cnpg-clusters
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
        - port: 6443
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-clients
  namespace: cnpg-clusters
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-main
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vaultwarden
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infisical
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pgadmin
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apicurio
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: uptime-kuma
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-replication
  namespace: cnpg-clusters
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-main
  policyTypes:
    - Ingress
    - Egress
  # 5432 is streaming replication. 8000 is the instance manager's own HTTP
  # API, which the instances use to probe EACH OTHER at /failsafe (see the
  # "Instance connectivity error" log line). Until 2026-08-26 only 5432 was
  # listed here, so every peer probe was dropped by default-deny-all and
  # timed out after its 1s deadline — confirmed with a live Hubble trace:
  #
  #   cnpg-clusters/pg-main-2:57940 <> cnpg-clusters/pg-main-4:8000
  #     policy-verdict:none EGRESS DENIED (TCP Flags: SYN)
  #     Policy denied DROPPED (TCP Flags: SYN)
  #
  # This ran for at least 16 days across every pg-main instance. It is NOT
  # caught by allow-cnpg-operator, which covers cnpg-system -> pod only, so
  # the operator's own calls to :8000 always worked and the gap stayed
  # invisible. Other CNPG namespaces (akan, k8s-docs, ...) are unaffected
  # because they carry a blanket allow-intra-namespace policy; cnpg-clusters
  # deliberately does not, so peer ports must be listed explicitly here.
  #
  # Consequence: CNPG's failsafe peer-liveness check — the mechanism that
  # lets an instance distinguish "I am isolated" from "my peer is down" —
  # was inoperative, so the cluster had no damping on failover decisions.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg-main
      ports:
        - port: 5432
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg-main
      ports:
        - port: 5432
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-barman-egress
  namespace: cnpg-clusters
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg-main
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
      ports:
        - port: 9000
    - ports:
        - port: 443
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: cnpg-clusters
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
