apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    chart: infisical-standalone
    targetRevision: "*"
    helm:
      valuesObject:
        infisical:
          enabled: true
          replicaCount: 2
          image:
            tag: latest-postgres
          autoDatabaseSchemaMigration: true
          existingSecret: infisical-secrets
          kubeSecretRef: infisical-secrets
        # Ingress config belongs at the chart ROOT, not under `infisical:` —
        # the chart's own key is top-level `ingress:` (and `hostName`, capital N).
        # Nested under `infisical:` the whole block was silently ignored, which is
        # why the live Ingress had to be hand-edited and masked with the
        # ignoreDifferences block below.
        #
        # `ingress.nginx.enabled` is also the Chart.yaml `condition:` gating the
        # bundled ingress-nginx SUBCHART. The old top-level `ingress-nginx.enabled:
        # false` was not that condition and did nothing: the subchart kept
        # rendering, and only the separate `controller.replicaCount: 0` held it at
        # 0 replicas — while its LoadBalancer Service still held MetalLB IP
        # 192.168.33.201 for a controller that could never serve. Setting the real
        # condition stops the subchart rendering at all.
        ingress:
          enabled: true
          ingressClassName: nginx
          hostName: infisical.yanatech.co.uk
          nginx:
            enabled: false
          tls:
            - secretName: wildcard-yanatech-tls
              hosts:
                - infisical.yanatech.co.uk
        postgresql:
          enabled: false
        redis:
          enabled: true
          architecture: standalone
          auth:
            enabled: false
          master:
            persistence:
              storageClass: ceph-rbd
              size: 5Gi
            podAnnotations:
              backup.velero.io/backup-volumes: redis-data
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      name: infisical-ingress
      namespace: infisical
      jsonPointers:
        - /spec/ingressClassName
        - /spec/rules
        - /spec/tls
    - group: apps
      kind: Deployment
      name: infisical-ingress-nginx-controller
      namespace: infisical
    - group: ""
      kind: Service
      name: infisical-ingress-nginx-controller
      namespace: infisical
    - group: ""
      kind: Service
      name: infisical-ingress-nginx-controller-admission
      namespace: infisical
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: infisical-ingress-nginx-admission
      jsonPointers:
        - /webhooks/0/failurePolicy
    - group: networking.k8s.io
      kind: IngressClass
      name: infisical-nginx
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: infisical-ingress-nginx
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: infisical-ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
