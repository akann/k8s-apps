apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prometheus-to-pve-exporters
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toCIDRSet:
        - cidr: 192.168.22.0/24
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
            - port: "9221"
              protocol: TCP
            # Ceph MGR Prometheus exporter. pve-firewall's host.fw already
            # accepts 192.168.33.0/24 → 9283; pfSense APP_VLAN→PMX_VLAN must
            # allow it too or this stays timed out.
            - port: "9283"
              protocol: TCP
