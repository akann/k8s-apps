apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.3.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        crds:
          upgradeJob:
            enabled: false
        defaultRules:
          disabled:
            # Cilium runs in full kube-proxy-replacement mode (see cilium-config
            # ConfigMap) — there is no kube-proxy DaemonSet on this cluster, ever,
            # so this alert is structurally unfixable and has fired continuously
            # since 2026-07-31. Confirmed via Alertmanager: KubeAPIDown/
            # KubeControllerManagerDown/KubeSchedulerDown are a separate, real
            # issue (control-plane components bind their metrics ports to
            # 127.0.0.1 — see the accompanying bind-address fix), not disabled here.
            KubeProxyDown: true
        grafana:
          enabled: true
          adminPassword: ""  # managed via grafana-authentik-secret
          env:
            GF_USERS_ALLOW_SIGN_UP: "true"
            GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
            GF_AUTH_GENERIC_OAUTH_NAME: Authentik
            GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email profiles
            GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://authentik.yanatech.co.uk/application/o/authorize/
            GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://authentik.yanatech.co.uk/application/o/token/
            GF_AUTH_GENERIC_OAUTH_API_URL: https://authentik.yanatech.co.uk/application/o/userinfo/
            GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'authentik Admins') && 'Admin' || 'Viewer'"
            GF_SERVER_ROOT_URL: https://grafana.yanatech.co.uk
            GF_SMTP_ENABLED: "true"
            GF_SMTP_HOST: "mail-eu.smtp2go.com:2525"
            GF_SMTP_FROM_NAME: "Grafana | YanaTech"
            GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              secretKeyRef:
                name: grafana-authentik-secret
                key: client_id
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-authentik-secret
                key: client_secret
            GF_SMTP_USER:
              secretKeyRef:
                name: grafana-smtp-secret
                key: smtp_username
            GF_SMTP_PASSWORD:
              secretKeyRef:
                name: grafana-smtp-secret
                key: smtp_password
            GF_SMTP_FROM_ADDRESS:
              secretKeyRef:
                name: grafana-smtp-secret
                key: smtp_from
            GRAFANA_PG_PASSWORD:
              secretKeyRef:
                name: grafana-pg-secret
                key: password
          plugins:
            - yesoreyeram-infinity-datasource
          additionalDataSources:
            - name: PostgreSQL (auth-service)
              type: postgres
              url: auth-service-pg-rw.yana-stocks.svc.cluster.local:5432
              user: app
              jsonData:
                database: app
                sslmode: require
                postgresVersion: 1600
              secureJsonData:
                password: $GRAFANA_PG_PASSWORD
            - name: Alertmanager
              type: alertmanager
              url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
              access: proxy
              jsonData:
                implementation: prometheus
            - name: Infinity
              type: yesoreyeram-infinity-datasource
              access: proxy
            - name: Loki
              type: loki
              # Explicit uid — Tempo's lokiSearch/tracesToLogsV2 below and the
              # ingress-access-logs dashboard reference it. Without this Grafana
              # generated a hashed uid (P8E80F9AEF21F6940) and those references
              # were dangling.
              uid: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              isDefault: false
            - name: Tempo
              type: tempo
              url: http://tempo.monitoring.svc.cluster.local:3200
              access: proxy
              isDefault: false
              jsonData:
                httpMethod: GET
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
                lokiSearch:
                  datasourceUid: loki
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: "-1h"
                  spanEndTimeShift: "1h"
                  filterByTraceID: true
                  filterBySpanID: false
                tracesToMetrics:
                  datasourceUid: prometheus
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.yanatech.co.uk
            tls:
              - hosts:
                  - grafana.yanatech.co.uk
                secretName: wildcard-yanatech-tls
        kubelet:
          serviceMonitor:
            # Full copy of the chart's default cAdvisorMetricRelabelings (kube-prometheus-stack
            # 87.3.0) plus one addition at the bottom. Helm values lists replace rather than
            # merge, so this has to be the complete list, not just the new rule — see the
            # retentionSize comment above for why this exists.
            cAdvisorMetricRelabelings:
              - sourceLabels: [__name__]
                action: drop
                regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
              - sourceLabels: [__name__]
                action: drop
                regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
              - sourceLabels: [__name__]
                action: drop
                regex: 'container_memory_(mapped_file|swap)'
              - sourceLabels: [__name__]
                action: drop
                regex: 'container_(file_descriptors|tasks_state|threads_max)'
              - sourceLabels: [__name__, scope]
                action: drop
                regex: 'container_memory_failures_total;hierarchy'
              - sourceLabels: [__name__, interface]
                action: drop
                regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
              - sourceLabels: [__name__]
                action: drop
                regex: 'container_spec.*'
              - sourceLabels: [id, pod]
                action: drop
                regex: '.+;'
              # Addition: container_memory_failures_total was the single biggest
              # cardinality offender found during the 2026-08-01 incident investigation
              # (~111k series, ~2x every other cAdvisor metric — the chart default above
              # only drops its scope="hierarchy" half). Rarely queried, rarely alerted on.
              - sourceLabels: [__name__]
                action: drop
                regex: 'container_memory_failures_total'
        prometheus:
          prometheusSpec:
            serviceMonitorSelector:
              matchLabels:
                release: kube-prometheus-stack
            additionalScrapeConfigs:
              - job_name: ceph
                static_configs:
                  - targets:
                      - 192.168.22.11:9283
                      - 192.168.22.12:9283
                      - 192.168.22.13:9283
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: pve-node-exporter
                static_configs:
                  - targets: ["192.168.22.11:9100"]
                    labels: {node: pve1}
                  - targets: ["192.168.22.12:9100"]
                    labels: {node: pve2}
                  - targets: ["192.168.22.13:9100"]
                    labels: {node: pve3}
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
              - job_name: pve-exporter
                metrics_path: /pve
                params:
                  target: [localhost]
                static_configs:
                  - targets: ["192.168.22.11:9221"]
                    labels: {node: pve1}
                  - targets: ["192.168.22.12:9221"]
                    labels: {node: pve2}
                  - targets: ["192.168.22.13:9221"]
                    labels: {node: pve3}
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: instance
            # Hard backstop against the 2026-08-01 incident: the 20Gi PVC filled
            # completely from cardinality growth (cAdvisor container_* metrics,
            # ~55k distinct cgroup ids from ephemeral CI runner pods + KEDA
            # scale-to-zero churn), and every WAL write failed silently for 3+
            # days ("no space left on device") until manually caught — every
            # dashboard/alert was blind that whole time. retentionSize below
            # 50Gi means Prometheus proactively deletes its oldest blocks well
            # before the disk actually fills, so a future cardinality spike
            # degrades gracefully (shorter retention) instead of hard-failing
            # every write with no warning.
            retentionSize: 45GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-rbd
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 50Gi
            podMetadata:
              annotations:
                backup.velero.io/backup-volumes: prometheus-kube-prometheus-stack-prometheus-db
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: gotify
              routes:
                - matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
                  receiver: "null"
                # MassiveFeedSilent alone is trading-hours-gated — the price
                # feed is *expected* to go quiet nights/weekends, so without
                # this it would page every night. Other alerts (e.g.
                # ExternalApiCircuitOpen below) get no such restriction — a
                # third-party API being down is meaningful at any hour.
                - matchers:
                    - alertname = "MassiveFeedSilent"
                  receiver: gotify
                  active_time_intervals:
                    - nyse-trading-hours
                - matchers:
                    - severity = critical
                  receiver: critical-alerts
            time_intervals:
              - name: nyse-trading-hours
                time_intervals:
                  - times:
                      - start_time: '09:30'
                        end_time: '16:00'
                    weekdays: ['monday:friday']
                    # IANA timezone — Alertmanager handles DST automatically,
                    # unlike the frontend's own manual-UTC-offset market-hours
                    # check (see yana-stocks' lib/market-hours.ts). No holiday
                    # calendar here either, same accepted limitation.
                    location: 'America/New_York'
            receivers:
              - name: "null"
              - name: gotify
                webhook_configs:
                  - url: 'http://alertmanager-gotify-bridge.gotify.svc.cluster.local/gotify_webhook'
                    send_resolved: true
              - name: critical-alerts
                webhook_configs:
                  - url: 'http://alertmanager-gotify-bridge.gotify.svc.cluster.local/gotify_webhook'
                    send_resolved: true
            inhibit_rules:
              - source_matchers:
                  - severity = critical
                target_matchers:
                  - severity =~ warning|info
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - severity = warning
                target_matchers:
                  - severity = info
                equal:
                  - namespace
                  - alertname
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-rbd
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi
            podMetadata:
              annotations:
                backup.velero.io/backup-volumes: alertmanager-kube-prometheus-stack-alertmanager-db
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: Prometheus
      name: kube-prometheus-stack-prometheus
      jqPathExpressions:
        - .spec.affinity
        - .spec.automountServiceAccountToken
        - .spec.enableOTLPReceiver
        - .spec.hostNetwork
        - .spec.imagePullPolicy
        - .spec.podMonitorNamespaceSelector
        - .spec.podMonitorSelector
        - .spec.probeNamespaceSelector
        - .spec.probeSelector
        - .spec.scrapeConfigNamespaceSelector
        - .spec.scrapeConfigSelector
        - .spec.serviceMonitorNamespaceSelector
        - .spec.shards
        - .spec.storage
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      jqPathExpressions:
        - .data["admin-password"]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
