# GHCR has no equivalent of Harbor's automated tag retention (see
# infrastructure/harbor/retention-policy-cronjob.yaml). akan/dove-house-tt/
# dove-house-tt-migrate are tagged by commit SHA on every CI push and nothing
# ever removes old tags, so every node that ever pulled a given SHA keeps it
# forever. Root cause of the 2026-08-04 worker disk-pressure incident
# (dove-house-tt-migrate alone: 36 tags/12.74GB on one node) — see UPDATES.md.
#
# Two-factor retention, deliberately more conservative than Harbor's plain
# "keep newest 10": a version is deleted only if it is BOTH outside the 10
# most-recently-pushed AND older than 14 days. The recency floor exists
# because dove-house-tt-stg can go quiet for a while between deploys — a
# pure rank-based cutoff could delete a tag that's still the live deployed
# image on a low-traffic environment, which "newest 10" alone cannot
# distinguish from "superseded". Sized generously given this workspace's
# push cadence (yana-stocks/k8s-apps push multiple times most days).
#
# MUST paginate. A first version of this job silently looked at only the
# first `per_page=100` versions — verified live 2026-08-04 against real
# data (dove-house-tt: 518 versions, dove-house-tt-migrate: 221,
# akan: 202, all >100), so every package here has always had versions
# past page 1 that a single unpaginated GET simply never saw. GitHub
# returns each page newest-first (verified live: page N's last created_at
# is always newer than page N+1's first), and array concatenation across
# pages in fetch order preserves that global ordering, so the same
# to_entries/select logic below still ranks correctly across the full set.
#
# MUST route the accumulated version list through a file, not jq --argjson.
# The first pagination fix passed the whole array as a CLI arg and hit
# `jq: Argument list too long` once it grew past the shell's ARG_MAX —
# the exact bug class already documented in this repo's own ml/k8s-docs
# ingest workflow fix (see CLAUDE.md, 2026-07-16, "MUST route every file's
# content through disk instead"). Same fix here: accumulate to a file.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ghcr-enforce-retention-policy
  namespace: argocd
spec:
  schedule: "30 3 * * 0" # weekly, Sunday — same cadence as Harbor's retention sweep
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: enforce-retention-policy
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache curl jq >/dev/null

                  owner="akann"
                  packages="dove-house-tt dove-house-tt-migrate akan"
                  keep_recent=10
                  keep_days=14
                  cutoff=$(( $(date +%s) - keep_days*86400 ))

                  for pkg in $packages; do
                    versions_file=/tmp/versions.json
                    echo '[]' > "$versions_file"
                    page=1
                    while true; do
                      curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/users/${owner}/packages/container/${pkg}/versions?per_page=100&page=${page}&state=active" \
                        > /tmp/page.json
                      n=$(jq 'length' /tmp/page.json)
                      jq -s '.[0] + .[1]' "$versions_file" /tmp/page.json > /tmp/versions.json.new
                      mv /tmp/versions.json.new "$versions_file"
                      [ "$n" -lt 100 ] && break
                      page=$((page+1))
                      # Safety backstop, not an expected ceiling: 50 pages =
                      # 5000 versions, far beyond anything these 3 packages
                      # should reach even after several missed weekly runs.
                      [ "$page" -gt 50 ] && { echo "package ${pkg}: aborting, exceeded 50 pages"; break; }
                    done

                    total=$(jq 'length' "$versions_file")
                    echo "package ${pkg}: ${total} versions"

                    # GitHub returns newest-first; drop the first keep_recent by
                    # position, then only delete what's also older than cutoff.
                    jq -r --argjson keep "$keep_recent" --argjson cutoff "$cutoff" '
                      to_entries
                      | map(select(.key >= $keep))
                      | map(select((.value.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff))
                      | .[].value.id' "$versions_file" > /tmp/del_ids.txt

                    count=$(grep -c . /tmp/del_ids.txt || true)
                    echo "package ${pkg}: deleting ${count} version(s) (outside newest ${keep_recent}, older than ${keep_days}d)"

                    while read -r id; do
                      [ -z "$id" ] && continue
                      curl -sf -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/users/${owner}/packages/container/${pkg}/versions/${id}"
                    done < /tmp/del_ids.txt
                  done
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-ghcr-retention-token
                      key: token
