apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-ghcr-retention-token
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: github-ghcr-retention-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /argocd/GITHUB_GHCR_RETENTION_TOKEN
