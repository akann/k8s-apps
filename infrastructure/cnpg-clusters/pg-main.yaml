apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-main
  namespace: cnpg-clusters
spec:
  instances: 4
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      # Cap how much WAL an inactive replication slot may pin. Default is -1
      # (unlimited): on 2026-08-18 two replicas diverged at a failover, their
      # slots went inactive, and unbounded retention grew pg_wal to 43GB on
      # pg-main-1 (88% of a 50Gi volume) and 26GB on the primary. With a cap,
      # an abandoned slot is invalidated instead of filling the disk — the
      # affected replica then needs a re-clone, which at this database size
      # (<1GB) takes about 30 seconds.
      max_slot_wal_keep_size: "16GB"
  storage:
    size: 50Gi
    storageClass: ceph-rbd
  # Continuous WAL archiving + base backups via the Barman Cloud Plugin.
  # Replaced spec.backup.barmanObjectStore on 2026-08-18 (removed in CNPG
  # 1.31.0). isWALArchiver designates this plugin as the WAL archiver; the
  # destination itself lives in the ObjectStore named below.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-main-store
  monitoring:
    # Intentionally false — see infrastructure/cnpg-clusters/podmonitor.yaml for
    # why the PodMonitor is hand-written instead of operator-generated.
    enablePodMonitor: false
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
