---
# Scrapes the CNPG instance metrics exporter (port 9187) on every pg-main pod.
#
# NOTE: this is a hand-written PodMonitor rather than `spec.monitoring.enablePodMonitor: true`
# on the Cluster. kube-prometheus-stack's Prometheus CR sets
#   podMonitorSelector: matchLabels: {release: kube-prometheus-stack}
# and CNPG offers no way to put labels on the PodMonitor it generates (only
# podMonitorRelabelings/podMonitorMetricRelabelings, which affect scraped samples,
# not the object's own metadata). An operator-generated PodMonitor would therefore
# be created and then silently ignored by Prometheus. Keep enablePodMonitor: false
# in pg-main.yaml so there is exactly one PodMonitor and no duplicate scrapes.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg-main
  namespace: cnpg-clusters
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg-main
  podMetricsEndpoints:
    - port: metrics
