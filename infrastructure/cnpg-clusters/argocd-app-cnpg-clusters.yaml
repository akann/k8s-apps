apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-clusters
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    # Opt out of ArgoCD's server-side diff for this Application.
    #
    # The diff pass runs a dry-run server-side apply WITHOUT force-conflicts.
    # pg-main's spec.backup is still owned by an older argocd-controller
    # managedFields entry with operation: Update (from before this app had
    # ServerSideApply), and enabling SSA does not retroactively convert that
    # ownership. So the dry-run cannot drop spec.backup, the merged object
    # holds both barmanObjectStore and plugins, and the CNPG webhook rejects
    # it — leaving the app permanently ComparisonError / Sync=Unknown, which
    # blocks the sync that would actually fix it.
    #
    # The sync itself applies with force-conflicts and succeeds. Once it has
    # run and ownership is held via Apply, this annotation can be removed.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
spec:
  project: default
  source:
    repoURL: https://github.com/akann/k8s-apps
    targetRevision: HEAD
    path: infrastructure/cnpg-clusters
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-clusters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Required for the Barman Cloud Plugin migration, and the only
      # cluster-owning Application that lacked it (immich, yana-stocks, ml,
      # dove-house-tt and akan all had it already). Without SSA, ArgoCD owns
      # spec.backup via an Update-operation field-manager entry and cannot
      # remove it when the manifest drops it — the merged object then holds
      # both barmanObjectStore and plugins, which the CNPG webhook rejects
      # with "Cannot enable a WAL archiver plugin when barmanObjectStore is
      # configured". That surfaces as a ComparisonError / Sync=Unknown on this
      # Application, not as a failed sync.
      - ServerSideApply=true
