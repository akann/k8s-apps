apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      releaseName: minio
      valuesObject:
        existingSecret: minio-secret
        # Built from source and hosted in Harbor, NOT the chart default
        # (quay.io/minio/minio): upstream images stopped being anonymously
        # pullable ~2026-09-25 and dl.min.io binaries return 410, which took
        # MinIO down for ~3.5 days. Same release the chart defaulted to.
        # Rebuild instructions: infrastructure/minio/image/Dockerfile.
        # ⚠️ The chart's mcImage (quay.io/minio/mc) has the same problem, but
        # nothing renders it while `users: []` and no buckets/policies are
        # configured. Enabling any of those needs mc mirrored too.
        image:
          repository: harbor.yanatech.co.uk/library/minio
          tag: RELEASE.2024-12-18T13-15-44Z
          pullPolicy: IfNotPresent
        # Chart default is a `console`/`console123` user with the consoleAdmin
        # policy. Empty here also stops the post-install/post-upgrade hook job
        # (minio-post-job) from rendering at all -- it could never reach
        # minio:9000 anyway, since this namespace has no egress on 9000.
        users: []
        mode: standalone
        # Single replica on an RWO Ceph RBD volume: the chart's default
        # RollingUpdate (maxUnavailable 0) deadlocks whenever the new pod
        # lands on a different node (Multi-Attach), which happened on the
        # 2026-09-28 image fix. Recreate stops the old pod first.
        # Key is lowercase `deploymentUpdate` in chart 5.4.0.
        deploymentUpdate:
          type: Recreate
        persistence:
          enabled: true
          storageClass: ceph-rbd
          size: 50Gi
        podAnnotations:
          backup.velero.io/backup-volumes: export
        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - minio.yanatech.co.uk
          tls:
            - hosts:
                - minio.yanatech.co.uk
              secretName: wildcard-yanatech-tls
        consoleIngress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - minio-console.yanatech.co.uk
          tls:
            - hosts:
                - minio-console.yanatech.co.uk
              secretName: wildcard-yanatech-tls
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        metrics:
          serviceMonitor:
            enabled: true
            namespace: monitoring
            additionalLabels:
              release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
